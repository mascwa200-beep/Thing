name: Android Build

# ⚠️ The run TITLE, because it is the one surface no client hides — a phone screenshot showed this
# repository's step summaries (ours AND `setup-gradle`'s) rendering nowhere at all. See the longer
# note in nutrition-build.yml; the same reasoning applies here. This app installs its own updates, so
# it matters less, but the two workflows should not disagree about where a build can be got.
run-name: "LCARS #${{ github.run_number }} — install from Releases ▸ latest"

on:
  push:
    # Build on every code branch, but skip the telemetry-only `debug-reports` branch the in-app
    # uploader writes to — it carries scrubbed crash reports (no code), so a build/republish there
    # would only churn the version with identical code. (Later `!` pattern wins over `**`.)
    branches:
      - "**"
      - "!debug-reports"
    # Same reasoning as the branch skip above, applied to a file. CLAUDE.md is the session-handoff
    # document and carries no code, so a commit touching only it produced a full build that
    # republished a byte-identical app under a new versionCode — which the in-app updater then
    # offers as an update, costing a ~158 MB download for nothing. Two of those shipped this
    # session before it was noticed.
    #
    # ⚠️ `paths-ignore` skips a run only when EVERY changed path matches, so a commit that touches
    # CLAUDE.md alongside real code still builds. That is the property this depends on; do not
    # widen the list to anything a build could actually depend on.
    paths-ignore:
      - "CLAUDE.md"
      # ⚠️ The standalone nutrition app cannot affect this one, and it is worth being precise about
      # why rather than trusting the module boundary: this job builds `:app:assembleRelease`, which
      # never reaches `:nutrition`, and `:nutrition` depends on `:core:telemetry` and
      # `:core:database` rather than the other way round. So a commit touching only that module or
      # its workflow has nothing here to rebuild. `settings.gradle.kts` and the version catalog are
      # shared and deliberately NOT listed — a change to either can move this build.
      - "nutrition/**"
      - ".github/workflows/nutrition-build.yml"
      # ⚠️ The standalone star map, for exactly the reason above and MISSED when that module was
      # created — so every `:sky`-only commit has been costing a full thirteen-minute build here
      # and republishing a 329 MB APK that the in-app updater then pulls in full. Two of those
      # shipped in the hour before this line was written, which is the second time this repository
      # has learned the same lesson.
      #
      # ⚠️ **`sky/**` and NOT `core/sky/**`, and the distinction is load-bearing.** `:app` really
      # does depend on `:core:sky` — it declares it, draws its console star map through `SkyChart`,
      # and this workflow has a step asserting the sky assets packaged — so a change there must
      # rebuild this app. What `:app:assembleRelease` never reaches is the `:sky` APPLICATION
      # module: nothing depends on it (checked, not assumed — no `project(":sky")` anywhere), and
      # an application cannot depend on an application.
      - "sky/**"
      - ".github/workflows/sky-build.yml"
      # ⚠️ The manual catalogue warmer, for the same reason and with one wrinkle worth stating:
      # it does touch something this build reads — it fills the shared Actions cache entry the
      # star-catalogue action restores. But that is the only thing it does, and a miss simply
      # means this build fills the entry itself. So editing the warmer can make this build
      # slower on a cold cache and can never make it wrong, which is the bar for this list.
      - ".github/workflows/sky-catalogue.yml"
      # ⚠️ The session scratchpad — probes and measurement harnesses, kept beside the work they
      # justify. Checked before listing it rather than assumed: it is referenced by NO build script
      # at all (`settings.gradle.kts`, the root script and every module's), so nothing here can
      # compile it. The other two workflows use allowlists, so it already cannot reach them; this is
      # the only filter that needs the entry.
      #
      # It earns its place because a probe-only commit otherwise costs a full thirteen-minute build
      # AND cancels whatever is in flight under `cancel-in-progress` — which in practice means
      # holding the push until an unrelated run has published, and that has already cost real time.
      - "scratchpad/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # The acoustic interrogator compiles native code (whisper.cpp / llama.cpp are coming).
          # ⚠️ The NDK string must match `ndkVersion` in app/build.gradle.kts exactly — AGP looks for
          # that one and reports only that it is missing, never that a different one is present.
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fetch whisper.cpp at a pinned tag
        run: |
          set -e
          dir=app/src/main/cpp/whisper.cpp
          repo=https://github.com/ggml-org/whisper.cpp
          # Pinned, not "latest": a native layer that follows upstream without anyone deciding to is
          # a build whose speech recognition can change under it.
          #
          # The tag below could NOT be verified when it was written - the development container
          # cannot reach GitHub - so rather than fail blind, the step falls back to the newest v*
          # tag and says loudly which one it used. That turns a wrong guess into the answer inside a
          # single ~25 minute round instead of two, and the fallback cannot drift silently because
          # it warns every time it fires. Pin whatever it reports.
          # ⚠️ MEASURED, NOT CHOSEN. This tag and the llama build below are a MATCHED PAIR: their
          # vendored ggml headers are byte-identical, which is the only condition under which both
          # projects can link into one .so. A CI probe swept both tag axes to find it — see the
          # commit that pinned them for the numbers. Moving either one alone will break the other.
          TAG="v1.9.2"
          if git clone --quiet --depth 1 --branch "$TAG" "$repo" "$dir" 2>/dev/null; then
            echo "whisper.cpp @ $TAG (pinned)"
          else
            newest=$(git ls-remote --tags --refs --sort=-v:refname "$repo" 'v*' | head -1 | sed 's#.*refs/tags/##')
            echo "::warning::pinned whisper.cpp tag $TAG did not resolve; using $newest - update TAG in this workflow"
            git clone --quiet --depth 1 --branch "$newest" "$repo" "$dir"
          fi
          # The CMake integration is guarded by if(EXISTS) so the tree's absence degrades to a
          # host-only build locally. On CI that guard must never be what decides, or a build that
          # quietly lost speech recognition would still go green.
          test -f "$dir/CMakeLists.txt" || { echo "FAIL: whisper.cpp tree is not present after cloning"; exit 1; }
          echo "whisper.cpp tree: $(du -sh "$dir" | cut -f1)"
          # Diagnostic, not a gate: whisper and llama each bundle ggml, so the two add_subdirectory
          # calls can collide on target names. Report how this tag guards it, so a collision is
          # explained in the same round it happens rather than the round after.
          echo "whisper ggml guard:"; grep -nE "NOT TARGET ggml|USE_SYSTEM_GGML" "$dir/CMakeLists.txt" || echo "  (none found)"

      - name: Fetch llama.cpp at a pinned build
        run: |
          set -e
          dir=app/src/main/cpp/llama.cpp
          repo=https://github.com/ggml-org/llama.cpp
          # ⚠️ llama.cpp tags are build numbers (b4600), NOT semver, so the pattern differs from
          # whisper's. Same fallback-and-warn shape and the same reason: this pin could not be
          # verified from a machine that cannot reach GitHub.
          # ⚠️ THE OTHER HALF OF A MATCHED PAIR — see the whisper TAG above, and do not move one
          # without re-running the search for the other.
          #
          # Both projects vendor ggml and only one copy may exist in the shipped .so, so the two tags
          # must carry the same ggml sync. Three rounds of inferring which build that was were wrong
          # in three different ways, so it was measured instead. Against whisper v1.9.2:
          #
          #   b10499=3  b10455=2  b10443=2  b10417=2  b10358=1  b10322=1
          #   b10276 == b10241 == b10197 IDENTICAL      b10141=1  b10021=3  b9945=5  b9867=6
          #
          # A contiguous window of identical builds, which is exactly what "one ggml sync spans a
          # range of build numbers" predicts. b10276 is the newest of that window.
          TAG="b10276"
          if git clone --quiet --depth 1 --branch "$TAG" "$repo" "$dir" 2>/dev/null; then
            echo "llama.cpp @ $TAG (pinned)"
          else
            newest=$(git ls-remote --tags --refs --sort=-v:refname "$repo" 'b*' | head -1 | sed 's#.*refs/tags/##')
            echo "::warning::pinned llama.cpp tag $TAG did not resolve; using $newest - update TAG in this workflow"
            git clone --quiet --depth 1 --branch "$newest" "$repo" "$dir"
          fi
          test -f "$dir/CMakeLists.txt" || { echo "FAIL: llama.cpp tree is not present after cloning"; exit 1; }
          echo "llama.cpp tree: $(du -sh "$dir" | cut -f1)"
          # ⚠️ THE API PROBE, and it is the point of this step beyond the clone. llama.cpp renamed a
          # good deal of its C API during 2024-25 (llama_load_model_from_file became
          # llama_model_load_from_file, vocab accessors moved off the model), so which names a given
          # build number carries is a fact about that tag rather than something to recall. Printing
          # it means one round answers both "does this tag exist" and "does the bridge use the right
          # names", instead of two.
          #
          # ⚠️ THE FOUR KV NAMES ARE HERE BECAUSE THIS LIST WAS ONCE INCOMPLETE AND COST A ROUND. The
          # original probe covered the rename family I was WORRIED about (model/vocab accessors) and
          # not the one that actually broke the build, because I had not recognised the KV-cache reset
          # as a rename family at all. A probe only ever answers what it was asked. When a symbol here
          # turns out to have moved, add its whole family rather than just the name that failed.
          hdr="$dir/include/llama.h"
          echo "llama.h API probe:"
          for sym in llama_backend_init llama_model_default_params llama_model_load_from_file \
                     llama_load_model_from_file llama_context_default_params llama_init_from_model \
                     llama_new_context_with_model llama_model_get_vocab llama_tokenize \
                     llama_batch_get_one llama_decode llama_sampler_chain_init \
                     llama_sampler_init_greedy llama_sampler_sample llama_vocab_is_eog \
                     llama_token_to_piece llama_model_free llama_free_model \
                     llama_memory_clear llama_get_memory llama_kv_self_clear llama_kv_cache_clear; do
            if grep -q "\b$sym\b" "$hdr" 2>/dev/null; then echo "  present  $sym"; else echo "  ABSENT   $sym"; fi
          done

      - name: Fetch quickjs-ng at a pinned tag
        run: |
          set -e
          dir=app/src/main/cpp/quickjs
          repo=https://github.com/quickjs-ng/quickjs
          # The JavaScript engine yt-dlp has required for full YouTube support since 2025.11.12.
          # quickjs-ng rather than Bellard's original because it ships a real CMakeLists (the
          # original is a Makefile) and because yt-dlp names it among the supported runtimes.
          #
          # ⚠️ UNLIKE THE TWO ABOVE, THIS TAG WAS MEASURED, NOT CHOSEN. raw.githubusercontent.com is
          # reachable from the development container even though the API and codeload are not, so
          # two candidate versions were fetched, built, and RUN end to end against the real 2.88 MB
          # YouTube player with real n and sig challenges:
          #
          #   quickjs-ng v0.11.0 (-O2)   FAILED - still running at 183 seconds
          #   quickjs-ng v0.16.0 (-O2)   ok in 7.8 seconds, answers byte-identical to node
          #   node (reference)           2.1 seconds
          #
          # More than a twentyfold difference, and v0.11.0 does not finish at all inside any sane
          # budget. yt-dlp says as much in its own source — `_QJS_MIN_RECOMMENDED` in
          # jsc/_builtin/quickjs.py names **(0, 12, 0)** as the floor for quickjs-ng, warning that
          # older builds are "missing important optimizations and will solve the JS challenges very
          # slowly". A first draft of this step pinned v0.11.0, which is below that floor; the
          # measurement is what caught it. **Do not lower this pin.**
          #
          # v0.16.0 is the newest tag that exists (v0.17.0 answers 404), and its CMakeLists was
          # checked to still define the `qjs` library target and both options set in cpp/CMakeLists.
          TAG="v0.16.0"
          if git clone --quiet --depth 1 --branch "$TAG" "$repo" "$dir" 2>/dev/null; then
            echo "quickjs-ng @ $TAG (pinned)"
          else
            newest=$(git ls-remote --tags --refs --sort=-v:refname "$repo" 'v*' | head -1 | sed 's#.*refs/tags/##')
            echo "::warning::pinned quickjs-ng tag $TAG did not resolve; using $newest - update TAG in this workflow"
            git clone --quiet --depth 1 --branch "$newest" "$repo" "$dir"
          fi
          test -f "$dir/CMakeLists.txt" || { echo "FAIL: quickjs tree is not present after cloning"; exit 1; }
          # ⚠️ The STATIC LIBRARY target name, asserted rather than assumed. CMakeLists.txt links
          # against `qjs`; `qjs_exe` and `qjsc` are the command-line tools and are deliberately not
          # built. If a future tag renames the library target, the failure would otherwise be a
          # link error four minutes into the build instead of one line here.
          grep -qE '^[[:space:]]*add_library\([[:space:]]*qjs\b' "$dir/CMakeLists.txt" || {
            echo "FAIL: this quickjs-ng defines no static library target named 'qjs'."
            echo "      Targets it does define:"
            grep -nE '^ *add_(library|executable)\(' "$dir/CMakeLists.txt" | sed 's/^/        /'
            exit 1
          }
          echo "quickjs tree: $(du -sh "$dir" | cut -f1), library target 'qjs' present"

      - name: Check the two ggml copies agree
        run: |
          set -e
          # ⚠️ THE WHOLE HEADER SET, NOT ONE SYMBOL — and that correction cost a round.
          # The first version of this gate compared `ggml_backend_sched_new` only. b5000 passed it
          # and then failed 212 objects deep on `GGML_KQ_MASK_PAD`, a macro one copy defines and the
          # other does not. Spot-checking a fast-moving C API symbol by symbol is a treadmill: each
          # round buys one more name.
          #
          # The real question is not "do these two agree about X" but "are these the same ggml
          # sync", and that is answerable exactly. whisper.cpp vendors ggml by copying it from
          # llama.cpp, so a matched pair has byte-identical public headers and a mismatched pair does
          # not. Comparing the directories settles every symbol at once, in about a second.
          #
          # ⚠️ AND A MISMATCH IS NO LONGER FATAL. Only one ggml may be linked — two would be an ODR
          # violation rather than a link error — so an unmatched pair cannot build both. Rather than
          # failing the whole app build for that, the llama tree is REMOVED and the build continues
          # with transcription and no adjudicator. That is not a fudge: `Rebuttal.Provenance` already
          # models "nothing read the argument" as a first-class outcome and says so on screen, and
          # `LlamaEngine.prepare` already returns false when the symbols are absent. The build says
          # loudly which it produced, and the APK check below asserts accordingly.
          # ⚠️ THIS STEP EXISTS BECAUSE THE PREDICTED FAILURE MODE WAS THE WRONG ONE. whisper.cpp and
          # llama.cpp each vendor ggml, and only one copy may end up in liblcarsnative.so — two would
          # be an ODR violation rather than a link error. So whisper is told to reuse llama's. The
          # CMake comment anticipated that a failed reuse would be a loud duplicate-target error. The
          # real failure was the opposite and much quieter: the reuse SUCCEEDED, and whisper then
          # compiled against a ggml four months older than the one it was written for —
          #
          #   whisper.cpp:591: error: no matching function for call to 'ggml_backend_sched_new'
          #   note: candidate function not viable: requires 5 arguments, but 6 were provided
          #
          # — four minutes into a build, in the middle of the C++ output. The signature is a fact
          # sitting in two headers that can be compared in two seconds, so it is compared here, and
          # BOTH are printed whether or not they match: when a future bump breaks this again, the log
          # already says what each side wants instead of requiring another round to find out.
          for tree in llama.cpp whisper.cpp; do
            hdr="app/src/main/cpp/$tree/ggml/include/ggml-backend.h"
            test -f "$hdr" || { echo "FAIL: $tree has no bundled ggml-backend.h at $hdr"; exit 1; }
            # The declaration spans lines in some versions, so newlines are folded before matching.
            sig=$(tr '\n' ' ' < "$hdr" | grep -o 'ggml_backend_sched_new *([^;]*)' | tr -s ' ' | head -1)
            # ⚠️ Without this, a rename of the function makes BOTH sides empty, the two empties
            # compare equal, and the gate passes while proving nothing. A check that cannot fail is
            # worse than no check.
            test -n "$sig" || { echo "FAIL: no ggml_backend_sched_new declaration found in $tree"; exit 1; }
            echo "  $tree: $sig"
            # ⚠️ Compared with every space removed, printed with them. Upstream wraps this
            # declaration across lines in some versions and not others, which leaves a space after
            # the open bracket in one and not the other — testing the readable forms reports two
            # IDENTICAL signatures as a mismatch and fails a build that would have worked. Found by
            # running this gate against a deliberately wrapped header rather than by reading it.
            eval "sig_$(echo "$tree" | tr -d '.')=\$(echo \"\$sig\" | tr -d ' ')"
          done
          # The decisive comparison: every public ggml header, byte for byte.
          if diff -r -q app/src/main/cpp/llama.cpp/ggml/include \
                        app/src/main/cpp/whisper.cpp/ggml/include > /tmp/ggml-diff.txt 2>&1; then
            echo "ggml headers are identical — the pins are the same sync, adjudicator enabled"
          else
            echo "::warning::whisper.cpp and llama.cpp carry DIFFERENT ggml syncs - building without the adjudicator"
            echo "Header differences (only one ggml may be linked, so both cannot build):"
            sed 's/^/  /' /tmp/ggml-diff.txt
            echo ""
            echo "To enable the adjudicator, move one pin until this comparison is clean."
            # CMake's own `if(EXISTS .../llama.cpp/CMakeLists.txt)` guard is the switch — removing
            # the tree turns the adjudicator off through machinery that already exists rather than
            # adding a second way to express the same thing.
            rm -rf app/src/main/cpp/llama.cpp
          fi

      # ⚠️ **BEFORE the unit tests, unlike the food database below, and the ordering is load-bearing.**
      # `SkyCatalogBundleTest` reads this asset off disk and runs in `:app:testDebugUnitTest`; the
      # catalogue is no longer committed (295 MB, and GitHub hard-rejects files over 100 MB), so a
      # restore placed after the tests would leave them reading a file that does not exist yet.
      # Everything about the depth, the cache key and what a cold run costs lives in the action.
      - name: The star catalogue
        id: skycat
        uses: ./.github/actions/star-catalogue

      - name: Run unit tests
        # ⚠️ Piped through tee so a failure can be RE-REPORTED readably below. `--stacktrace` puts
        # several hundred frames after the message, and the log API's tail cannot reach back past
        # them — two failures in a row this session were diagnosed by inference because the one line
        # that mattered was unreachable. pipefail keeps gradle's exit code across the pipe.
        run: |
          set -o pipefail
          # ⚠️ `:core:telemetry:test`, NOT `testDebugUnitTest`. That module is a plain Kotlin/JVM
          # module now (it is what lets :desktop depend on it directly instead of copying 53 files),
          # and a JVM module has no build variants — so the Android task name simply does not exist
          # there any more. Getting this wrong does not fail loudly: gradle would report an unknown
          # task, and 1,322 core tests would stop being a gate.
          # ⚠️ `:core:update` was absent from this line and had no tests at all, so its update
          # policy and its crash-report path were gated by nothing. It is an Android library,
          # so `testDebugUnitTest` is the right task name here — see the warning above about
          # getting that wrong quietly.
          ./gradlew :core:telemetry:test :core:feeds:test :core:model-inference:testDebugUnitTest :core:health:testDebugUnitTest :core:update:testDebugUnitTest :core:sky:testDebugUnitTest :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-tests.log

      # ─────────────────────────── the offline food database ───────────────────────────
      # ~4.5M retail barcodes, so a scan works in a supermarket basement with no signal. Built
      # here rather than committed: it is 296 MB and GitHub hard-rejects files over 100 MB, and
      # this repository has no LFS.
      #
      # ⚠️ Placed AFTER the unit tests on purpose. A cold cache spends about a quarter of an hour
      # downloading 1.7 GB and merging it; a failing test should not have to wait for that first.
      - name: Restore the food database
        id: fooddb
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/food/food.db
          # ⚠️ The salt at the end is a MANUAL rebuild switch. The builder's own hash covers a code
          # change, but the sources move underneath it — a fresh Open Food Facts export adds real
          # products and the key would not notice. Bump the salt to take a new snapshot.
          #
          # ⚠️ **BUMP IT FOR ANY CHANGE TO HOW OR WHAT WE FETCH, not only for a newer release.**
          # The salt encodes the source DATES, so moving to a later USDA drop is bumped naturally.
          # What it does not catch is a change to the URL's SHAPE at the same date — which is
          # exactly the `_json_`→`_csv_` correction below, and that fix reached a real rebuild only
          # because the same commit happened to touch build_food_db.py and so moved the hash. A URL
          # correction landing on its own would restore the stale, wrong database and the fix would
          # do nothing, silently. Verified after the fact rather than assumed: the run on that
          # commit did rebuild, and the packaged database measures 312 MB — the size with USDA
          # merged in, not the smaller Open-Food-Facts-only one.
          #
          # Deliberately NOT hashing this whole workflow file into the key. It is edited often (every
          # gate added here would invalidate it), and a quarter-hour cold rebuild on an unrelated
          # tweak is the wrong trade. The salt is the designed switch; it only needed to say when.
          #
          # ⚠️ **THE HASH COVERS EVERY FILE THE BUILDER READS, WHICH IS NOW THREE.** The builder
          # takes its list of further nutrients out of `NutrientSet.kt` — that Kotlin file is the
          # single declaration of each one's permanent id, unit and scale — via `nutrient_set.py`.
          # With only the builder hashed, adding a nutrient to the enum, or correcting a scale,
          # would restore the STALE database and the change would do nothing at all, silently. That
          # is the same trap the paragraph above records about a URL correction, and this one would
          # be worse: a scale correction that never takes effect leaves a wrong number on screen.
          key: >-
            food-db-${{ hashFiles('tools/food/build_food_db.py', 'tools/food/nutrient_set.py',
            'core/telemetry/src/main/java/dev/mascwa/pulse/core/telemetry/NutrientSet.kt')
            }}-off20260824-usda20260430

      - name: Build the food database
        if: steps.fooddb.outputs.cache-hit != 'true'
        # ⚠️ NOT a hard gate, and the split matters. This step reaches two servers neither of us
        # controls, and coupling every build of the whole application to Open Food Facts being up
        # would be the wrong trade for one feature. A source outage warns loudly and ships without
        # the bundle — `FoodDatabase.open` returns null and the network path the app has always had
        # still works. What IS a hard gate is the assertion below: an asset we placed and then
        # failed to package is a real defect, and that is the silent one.
        continue-on-error: true
        run: |
          set -o pipefail
          echo "disk before:"; df -h / | tail -1
          # ⚠️ **Printed because the run before this one died in this step with no log and no
          # failing command.** `continue-on-error` is set, so a builder that crashed would have been
          # swallowed and the job would have carried on to the APK — it did not, which means the
          # runner itself went away rather than the script failing. That is what running out of a
          # system resource looks like, and nothing recorded which one. These three lines make the
          # next occurrence say so instead of leaving it to inference.
          echo "--- before ---"; df -h / /mnt 2>/dev/null | sed "s/^/    /"; free -m | sed "s/^/    /"
          work=/tmp/fooddb
          mkdir -p "$work" app/src/main/assets/food

          # Open Food Facts, ODbL. 302s to S3, hence -L. 1,275,171,186 bytes as of the pin.
          OFF=https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
          # USDA FoodData Central branded foods, public domain. The date is part of the path.
          # ⚠️ Probed before pinning: SUPERSEDED RELEASES STAY LIVE (the 2025-04-24 file still
          # answers 206), so this URL cannot 404 when a newer one lands. Bumping it is a choice
          # about freshness, never an emergency. 2026-04-30 was the newest on the pin date; the
          # four plausible later dates all answered 404.
          # ⚠️ **_csv_, NOT _json_, and that distinction cost a silently degraded database.** The
          # first version of this step used the `json` archive because the pin was chosen by date
          # without checking what the BUILDER reads — and `build_food_db.py` parses
          # `branded_food.csv`. The json archive holds one 3.3 GB JSON member, so the builder found
          # no CSV, skipped USDA entirely, and still reported VERIFY PASSED: run 1962 shipped
          # 48.8% nutrition coverage instead of 56.3%, with the whole 1.5M-row USDA merge missing.
          # Measured after the fact: the csv archive is 448,767,220 bytes, byte-for-byte what a
          # local copy of the same release holds. The gate below now makes that failure loud.
          USDA=https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_branded_food_csv_2026-04-30.zip

          # ⚠️ Each source is fetched into place only on success. A half-downloaded file is worse
          # than a missing one: the builder would read it, hit a truncated gzip stream part way
          # through, and produce a database that looks complete and silently stops at Kellogg's.
          for pair in "OFF:$OFF:off.csv.gz" "USDA:$USDA:usda_branded.zip"; do
            label=${pair%%:*}; rest=${pair#*:}; url=${rest%:*}; name=${rest##*:}
            echo "fetching $label…"
            if curl -fSL --retry 3 --retry-delay 10 --max-time 1800 -o "$work/$name.part" "$url"; then
              mv "$work/$name.part" "$work/$name"
              echo "  $label: $(du -h "$work/$name" | cut -f1)"
            else
              rm -f "$work/$name.part"
              echo "::warning::could not fetch $label — the database will be built without it"
            fi
          done

          # ⚠️ `/usr/bin/time -v` reports PEAK resident memory, which is the number that
          # matters here: the USDA merge holds every branded item in one dict while it makes
          # three passes over the archive, so this builder's footprint is dominated by one
          # structure and that structure grows with every column added to it.
          # ⚠️ Guarded, because a DIAGNOSTIC that can break the build is worse than none:
          # `/usr/bin/time` is a package rather than the shell builtin, and if a future
          # runner image drops it an unguarded invocation would fail the whole step.
          TIMER=""; [ -x /usr/bin/time ] && TIMER="/usr/bin/time -v"
          if $TIMER python3 tools/food/build_food_db.py --work "$work" --out app/src/main/assets/food/food.db 2> >(tee /tmp/fooddb-time.log >&2); then
            echo "food.db: $(du -h app/src/main/assets/food/food.db | cut -f1)"
          else
            echo "::warning::the food database did not build — this APK ships without offline barcodes"
            # ⚠️ Removed rather than left behind. The builder writes as it goes, so a failure can
            # leave a partial database — which would package, open, and answer a fraction of scans
            # with silence. No database at all is an honest state the app already handles.
            rm -f app/src/main/assets/food/food.db
          fi
          # 1.7 GB of sources are of no further use and the APK build needs the room.
          rm -rf "$work"
          echo "--- after ---"; df -h / /mnt 2>/dev/null | sed "s/^/    /"; free -m | sed "s/^/    /"
          grep -E "Maximum resident set size|Elapsed .wall clock" /tmp/fooddb-time.log 2>/dev/null | sed "s/^/    /" || true
          echo "disk after:"; df -h / | tail -1

      - name: Build release APK
        # Release here is the SHIPPED sideload build: non-debuggable (so the baseline profile is honoured
        # for PGO-style AOT) but kept on the same package id + debug keystore as before, so it updates in
        # place. The run number is the versionCode so each build out-versions the last (no downgrades).
        run: |
          set -o pipefail
          # ⚠️ `:app:assembleRelease`, NOT the root task. The root `assembleRelease` builds EVERY
          # application module, and there are two of them now — so a bare invocation would build the
          # standalone nutrition APK on every LCARS commit, adding minutes to each run and producing
          # an artifact this job neither checks nor publishes. The nutrition workflow builds its own.
          ./gradlew :app:assembleRelease -PPULSE_VERSION_CODE=${{ github.run_number }} --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Say what actually went wrong
        # ⚠️ Runs ONLY on failure, and exists because the stack trace buries the message. Gradle
        # prints "What went wrong" BEFORE several hundred frames of
        # org.gradle.internal.execution.steps, so on a long failure the log API returns nothing but
        # frames however far back it is asked to look. Re-printing the useful section at the END puts
        # it where a tail can always find it. The stack is kept — it diagnosed the Chaquopy
        # configuration-cache failure earlier today — it is simply no longer the last word.
        if: failure()
        run: |
          for f in /tmp/gradle-tests.log /tmp/gradle-build.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            # ⚠️ The COMPILER's own messages first. "What went wrong" says only "Compilation error.
            # See log for more details", which is exactly as useless as it sounds — the `e:` lines
            # naming the file, line and symbol are hundreds of stack frames earlier and a tail of the
            # log never reaches them. That cost a whole round trip to diagnose a one-line fix.
            echo "----- compiler errors -----"
            grep -E "^(e|w): .*: error:|^e: " "$f" | head -40 || true
            echo "----- gradle's summary -----"
            awk '/^\* What went wrong:/,/^\* Try:/' "$f" | head -40
            echo "----- failing tests, if any -----"
            grep -E "FAILED$|^[A-Za-z].*> .* FAILED" "$f" | head -20 || true
          done

      - name: Verify the native layer packaged
        # ⚠️ This is the ONLY gate on the native build, and it has to live here.
        # `:app:testDebugUnitTest` runs on the host JVM, so it cannot load an arm64-v8a .so — a unit
        # test asserting NativeBridge.available would fail on a perfectly good build and pass on one
        # where CMake silently produced nothing. What actually proves the toolchain worked is the
        # library being inside the shipped APK, for the target ABI, so that is what is asserted.
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "inspecting $apk"
          if unzip -l "$apk" | grep -q "lib/arm64-v8a/liblcarsnative.so"; then
            unzip -l "$apk" | grep "lib/arm64-v8a/" || true
            # ⚠️ And that whisper.cpp really linked. Its JNI entry points are compiled only under
            # HAVE_WHISPER, so their ABSENCE from the shipped library is the check - a missing symbol
            # is a fact, where a runtime flag would only be a claim. `nm -D` reads the dynamic symbol
            # table, which survives stripping because JNI could not resolve anything otherwise.
            unzip -p "$apk" lib/arm64-v8a/liblcarsnative.so > /tmp/lcarsnative.so
            if nm -D --defined-only /tmp/lcarsnative.so | grep -q "WhisperNative_nativeInit"; then
              echo "whisper.cpp linked:"
              nm -D --defined-only /tmp/lcarsnative.so | grep WhisperNative || true
              # ⚠️ whisper is REQUIRED and llama is CONDITIONAL, and the difference is deliberate.
              # Without transcription the feature does not exist; without the adjudicator it is
              # honestly weaker and says so on screen (Rebuttal.Provenance.PATTERN_ONLY). The ggml
              # step above removes the llama tree when the two vendored copies are different syncs,
              # so its absence here is that decision arriving — asserted against the tree rather
              # than assumed, so a llama tree that IS present and still failed to link is a failure.
              if [ -d app/src/main/cpp/llama.cpp ]; then
                if nm -D --defined-only /tmp/lcarsnative.so | grep -q "LlamaNative_nativeInit"; then
                  echo "llama.cpp linked:"
                  nm -D --defined-only /tmp/lcarsnative.so | grep LlamaNative || true
                else
                  echo "FAIL: the llama.cpp tree is present but its JNI symbols are not in the library."
                  exit 1
                fi
              else
                echo "::warning::built without the adjudicator - see the ggml compatibility step above"
              fi
              # ⚠️ `nativeVersion`, NOT `nativeAvailable`, AND THE DIFFERENCE IS THE WHOLE GATE.
              # `nativeAvailable` is compiled in BOTH CMake branches — it has to be, or the Kotlin
              # call that asks whether JavaScript exists would raise UnsatisfiedLinkError instead of
              # answering "no" — so `nm` finding it proves nothing at all, and a check written
              # against it would pass on a build with no engine in it. `nativeVersion` cannot be
              # linked without QuickJS, so its presence is a fact about the build.
              #
              # Fatal rather than a warning: without JavaScript, yt-dlp says outright that "YouTube
              # extraction without a JS runtime has been deprecated, and some formats may be
              # missing" — which is the defect this whole change exists to remove, and it would
              # ship green.
              if nm -D --defined-only /tmp/lcarsnative.so | grep -q "JsRuntime_nativeVersion"; then
                echo "quickjs linked:"
                nm -D --defined-only /tmp/lcarsnative.so | grep JsRuntime || true
              else
                echo "FAIL: liblcarsnative.so shipped WITHOUT QuickJS - the if(EXISTS) guard took"
                echo "      the engine-less branch, so YouTube extraction would silently lose formats."
                exit 1
              fi
            else
              echo "FAIL: liblcarsnative.so shipped WITHOUT whisper.cpp - the if(EXISTS) guard took the"
              echo "      host-only branch, so speech recognition would be silently absent."
              nm -D --defined-only /tmp/lcarsnative.so | grep Java_ || echo "(no JNI exports at all)"
              exit 1
            fi
          else
            echo "FAIL: liblcarsnative.so is not in the APK — the CMake build produced nothing."
            unzip -l "$apk" | grep "lib/" || echo "(no native libraries at all)"
            exit 1
          fi

      - name: Verify the food database packaged
        # ⚠️ THE SPLIT THIS STEP EXISTS FOR. Two things can leave an APK with no offline barcodes and
        # they deserve opposite treatment:
        #
        #   - the source servers were unreachable  → the step above warned; nothing is asserted here,
        #                                            and the app degrades to the network path
        #   - we placed the asset and it is not in
        #     the APK                              → a packaging defect. HARD FAIL.
        #
        # The second is the silent one. A 296 MB asset is unlike anything else this build packages,
        # and an aapt limit, a `noCompress` change or an ignore rule would drop it while the build
        # stayed perfectly green and every scan quietly failed on the device.
        run: |
          set -e
          asset=app/src/main/assets/food/food.db
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ ! -f "$asset" ]; then
            echo "::warning::no food.db was placed for this build — the APK has no offline barcodes"
            echo "Scanning still works with a network. See the build step above for why it is absent."
            exit 0
          fi
          echo "asset on disk: $(du -h "$asset" | cut -f1)"
          # ⚠️ Read out of the APK's own directory rather than trusting the file we wrote. The
          # question is what shipped.
          line=$(unzip -l "$apk" | grep "assets/food/food.db" || true)
          if [ -z "$line" ]; then
            echo "FAIL: food.db is on disk but NOT in the APK — packaging dropped it."
            echo "Assets that did make it:"
            unzip -l "$apk" | grep "assets/" | head -20
            exit 1
          fi
          size=$(echo "$line" | awk '{print $1}')
          echo "packaged: $line"
          # ⚠️ A size floor, because "present" is not "whole". `unzip -l` reports the UNCOMPRESSED
          # size, so this is the real database and not its ~118 MB deflated form. A truncated or
          # empty-schema database is a valid SQLite file that answers every barcode with nothing —
          # it would package, open, and fail silently. 100 MB is far below the real 296 MB and far
          # above any plausible stub.
          if [ "$size" -lt 100000000 ]; then
            echo "FAIL: the packaged food.db is only $size bytes — that is not the full corpus."
            exit 1
          fi
          # ⚠️ The sentinel. Every other gate in this workflow carries one for the same reason: a
          # matcher that finds anything, or a grep that silently matches nothing, is worse than no
          # gate at all. If this ever "finds" a file that cannot exist, the check above proves
          # nothing either.
          if unzip -l "$apk" | grep -q "assets/food/this-must-not-exist.db"; then
            echo "FAIL: the sentinel matched — this check cannot distinguish present from absent."
            exit 1
          fi
          echo "food database packaged: $((size / 1048576)) MB uncompressed (sentinel correctly absent)"

          # ⚠️ And the generic-food seed, which is a different asset with a different failure mode.
          # The database above is built and cached, so a run that skipped it should still publish;
          # the seed is a small committed file and is now an asset of :core:health rather than of
          # this application, so its absence can only mean the LIBRARY ASSET MERGE stopped working —
          # which would take the generic foods out of both applications at once, silently, and
          # render as "no such food" on every search by name.
          seed=$(unzip -l "$apk" | grep "assets/food/seed.tsv" || true)
          if [ -z "$seed" ]; then
            echo "FAIL: the generic-food seed is not in the APK — the :core:health asset merge broke."
            unzip -l "$apk" | grep "assets/food/" || echo "(no food assets at all)"
            exit 1
          fi
          seedSize=$(echo "$seed" | awk '{print $1}')
          # Uncompressed, like the figure above. The real file is ~3.1 MB across 13,186 foods; a
          # truncated one parses perfectly and just answers fewer questions.
          if [ "$seedSize" -lt 2000000 ]; then
            echo "FAIL: the packaged seed is only $seedSize bytes — that is not 13,186 foods."
            exit 1
          fi
          if unzip -l "$apk" | grep -q "assets/food/this-seed-must-not-exist.tsv"; then
            echo "FAIL: the sentinel matched — this check cannot distinguish present from absent."
            exit 1
          fi
          echo "generic-food seed packaged: $seedSize bytes (sentinel correctly absent)"

      - name: Verify the sky assets packaged, and the catalogue stored uncompressed
        # ⚠️ **These moved out of this application and into `:core:sky`, so from here on their
        # presence is a LIBRARY ASSET MERGE and its failure would be silent.** Two applications read
        # them now; one copy in the repository is the point. But a merge that stopped working
        # compiles, packages, publishes and goes green, and shows up only as a star map with no
        # stars — exactly the class of failure the food-seed check beside this one was written for.
        #
        # ⚠️ The expected list is DERIVED from the directory rather than typed here, so an asset
        # added later is covered without anyone remembering. That deliberately does not guard
        # against a file being deleted from disk — a different problem, and one the :app unit tests
        # already catch by reading each of them.
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          dir=core/sky/src/main/assets/sky
          missing=0
          for f in "$dir"/*; do
            name=$(basename "$f")
            if ! unzip -l "$apk" | grep -q "assets/sky/$name"; then
              echo "FAIL: $name is in $dir but NOT in the APK — the :core:sky asset merge broke."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sky assets that DID make it:"
            unzip -l "$apk" | grep "assets/sky/" || echo "(none at all)"
            exit 1
          fi
          # ⚠️ The sentinel, for the reason every other gate here carries one: a grep that silently
          # matches nothing, or one that matches anything, proves as much as no gate at all.
          if unzip -l "$apk" | grep -q "assets/sky/this-must-not-exist.bin"; then
            echo "FAIL: the sentinel matched — this check cannot distinguish present from absent."
            exit 1
          fi
          echo "sky assets packaged: $(ls "$dir" | tr '\n' ' ') (sentinel correctly absent)"

          # ⚠️ The catalogue's own three questions — present, STORED not deflated, and the right
          # DEPTH — moved into `tools/sky/check_packaged.py`, because three workflows ask them and a
          # shell copy in each is how they drift. The depth check is new and it is the one that
          # matters now the file is built rather than committed: a restored G<12 catalogue in a
          # G<15 build compiles, packages, installs and draws a perfectly plausible sky that simply
          # stops early. Everything the old block explained about `noCompress` is in that script.
          python3 tools/sky/check_packaged.py --apk "$apk" --magnitude ${{ steps.skycat.outputs.magnitude }}

      - name: Verify the Python runtime packaged
        # ⚠️ Same reasoning as the native gate above, for the same reason it lives here rather than in
        # a unit test: `:app:testDebugUnitTest` runs on the host JVM and cannot start an arm64
        # interpreter, so an assertion there would fail on a good build. What proves Chaquopy worked
        # is the interpreter, its standard library and OUR module all being inside the shipped APK.
        #
        # ⚠️ Three separate assertions, not one, because they are three different failures:
        #   - no libpython           → the plugin did not build the native interpreter at all
        #   - no stdlib asset        → an interpreter that starts and cannot import anything
        #   - no lcars_probe.py      → the plugin ran but never saw src/main/python
        # A single "is Python in there" check would pass on the second and third and the build would
        # ship something that only fails on the device.
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "inspecting $apk"
          listing=$(unzip -l "$apk")

          if ! echo "$listing" | grep -qE "lib/arm64-v8a/libpython3.*\.so"; then
            echo "FAIL: no libpython in the APK — Chaquopy did not package an interpreter."
            echo "$listing" | grep "lib/arm64-v8a/" || echo "(no arm64 libraries at all)"
            exit 1
          fi
          echo "interpreter:"
          echo "$listing" | grep -E "lib/arm64-v8a/lib(python|chaquopy)" || true

          # Chaquopy ships the standard library and the app's own Python as assets extracted on first
          # run. The exact asset layout is a plugin implementation detail, so this matches on the
          # directory it has always used rather than on an exact filename.
          if ! echo "$listing" | grep -q "assets/chaquopy/"; then
            echo "FAIL: no assets/chaquopy/ — the interpreter would start with nothing to import."
            exit 1
          fi
          echo "python assets:"
          echo "$listing" | grep "assets/chaquopy/" | head -20

          # And that OUR module is in there. It is inside one of the asset zips rather than a loose
          # file, so the check greps the zip bytes — the name is stored uncompressed in the entry
          # header even when the content is deflated, which is what makes this work at all.
          found=""
          for entry in $(echo "$listing" | awk '/assets\/chaquopy\/.*\.(zip|imy)$/ {print $4}'); do
            unzip -p "$apk" "$entry" > /tmp/pyasset.bin 2>/dev/null || continue
            if grep -qa "${PROBE}" /tmp/pyasset.bin; then found="$entry"; break; fi
          done
          if [ -z "$found" ]; then
            echo "FAIL: ${PROBE} is not in any Python asset — src/main/python was not picked up."
            exit 1
          fi
          echo "our module is in $found"

          # ⚠️ And that the pip requirement really made it in. `pip { install(...) }` resolving at
          # build time proves the wheel DOWNLOADED; it does not prove it was packaged into the APK,
          # and a build that quietly shipped without the extractor would look completely fine until
          # the first attempt to play something. Separate assertion, separate failure.
          #
          # It is not in the same asset as our source — Chaquopy keeps requirements apart from the
          # app's own Python — so every asset archive is searched rather than assuming a filename.
          ext=""
          for entry in $(echo "$listing" | awk '/assets\/chaquopy\/.*\.(zip|imy)$/ {print $4}'); do
            unzip -p "$apk" "$entry" > /tmp/pyasset.bin 2>/dev/null || continue
            if grep -qa "${EXTRACTOR}" /tmp/pyasset.bin; then ext="$entry"; break; fi
          done
          if [ -z "$ext" ]; then
            echo "FAIL: ${EXTRACTOR} is not in any Python asset — the pip requirement did not ship."
            echo "$listing" | grep "assets/chaquopy/" || true
            exit 1
          fi
          echo "the extractor is in $ext"

          # ⚠️ **AND THE JS SOLVER LIBRARY, WHICH IS A SEPARATE WHEEL AND A HARD REQUIREMENT.**
          # `yt-dlp-ejs` is its own pip requirement, so the `yt_dlp/` probe above does NOT cover it —
          # measured: that pattern has a trailing slash and `yt_dlp_ejs/` does not contain it.
          #
          # Why its absence would be invisible rather than loud: yt-dlp vendors only the solver's
          # CORE. Measured against the pinned 2026.07.04, its `_builtin/vendor` holds
          # `yt.solver.core.js` (12,607 bytes) plus `yt.solver.deno.lib.js` (245 bytes) and
          # `yt.solver.bun.lib.js` (237 bytes) — NPM shims for two runtimes that are not ours. The
          # real library is `yt_dlp_ejs/yt/solver/lib.min.js`, **151,561 bytes**, and it ships in no
          # other package. So without this wheel the QuickJS provider still registers, still reports
          # `javascript: quickjs 0.16.0` in the notes, and has no solver to run — a silent, total
          # loss of the feature behind a status line that says it is working.
          #
          # ⚠️ **THE FULL PATH, not the bare filename, and the reason is subtler than it looks.**
          # `yt_dlp` itself contains the literal string `lib.min.js` — twice in
          # `jsc/_builtin/ejs.py` (`ScriptType.LIB: 'yt.solver.lib.min.js'`) and again in its
          # `.pyc`. Measured, a bare-filename probe does NOT match that today, because those entries
          # are stored DEFLATED and only entry NAMES sit uncompressed in the header. But that is an
          # accident of compression, not a property: the day Chaquopy stores one entry uncompressed,
          # a bare probe starts matching yt-dlp's own source and the gate silently stops failing.
          # The full path is an entry name no other package has, so it does not rest on that.
          #
          # It is also the file rather than the package directory, because a package that shipped
          # its metadata and not its data files would satisfy the weaker check.
          lib=""
          for entry in $(echo "$listing" | awk '/assets\/chaquopy\/.*\.(zip|imy)$/ {print $4}'); do
            unzip -p "$apk" "$entry" > /tmp/pyasset.bin 2>/dev/null || continue
            if grep -qa "${SOLVER}" /tmp/pyasset.bin; then lib="$entry"; break; fi
          done
          if [ -z "$lib" ]; then
            echo "FAIL: ${SOLVER} is not in any Python asset — yt-dlp-ejs did not ship, so YouTube"
            echo "      extraction has a JavaScript engine and nothing for it to run."
            echo "$listing" | grep "assets/chaquopy/" || true
            exit 1
          fi
          echo "the JS solver library is in $lib"
          echo "Python runtime packaged."

          # ⚠️ Reported on every build because it is paid on every UPDATE, not once: the APK goes to
          # the rolling `latest` release and the in-app updater pulls the whole thing. Chasing the
          # figure after the fact is not possible — the release asset is overwritten — so the only
          # way to know what a change cost is to have measured the build before it.
          bytes=$(stat -c%s "$apk")
          echo "APK: $((bytes / 1024 / 1024)) MB ($bytes bytes)"
          echo "largest components:"
          unzip -l "$apk" | sort -k1 -n -r | head -12
        env:
          PROBE: lcars_probe.py
          EXTRACTOR: yt_dlp/
          # The library file itself, not the package directory — see the assertion above.
          SOLVER: yt_dlp_ejs/yt/solver/lib.min.js

      - name: Verify Python's Java lookups survived R8
        # ⚠️ THIS STEP EXISTS BECAUSE ITS ABSENCE SHIPPED A BROKEN THEATER FOR MONTHS.
        #
        # `proguard-rules.pro` predicted the failure in writing — "R8 renames or removes classes the
        # native interpreter resolves BY NAME at runtime, so the build goes green, the APK ships, and
        # Python fails on the device. Nothing in CI could catch that" — and then it happened, to a
        # class its own keeps did not cover. `jclass('dev.mascwa.pulse.data.media.JsRuntime')` threw
        # NoClassDefFoundError on every release build, so yt-dlp had no JavaScript runtime, so
        # YouTube's `n` parameter was never transformed, so every media URL came back 403.
        #
        # It went unnoticed for five rounds of debugging because the native gate above passes
        # CORRECTLY the whole time: `nm -D` reads the C++ JNI symbol, which R8 cannot touch. The
        # engine really was in the .so. The Kotlin class binding to it was not in the DEX.
        #
        # "Nothing in CI could catch that" was true and did not have to be. This is the catch.
        #
        # ⚠️ THE NAMES ARE DERIVED FROM THE PYTHON, NEVER LISTED HERE. A hand-kept list is a second
        # statement of the same fact and only one of the two ever gets updated — the exact drift this
        # repo has already corrected in NotifId, WidgetLinkageTest and the desktop mirror map. Add a
        # `jclass('...')` to the Python without a keep rule and this fails on the next build.
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "inspecting $apk"

          names=$(grep -rhoE "jclass\(['\"][A-Za-z0-9_.]+['\"]\)" app/src/main/python/ \
                  | sed -E "s/jclass\(['\"]([A-Za-z0-9_.]+)['\"]\)/\1/" | sort -u)

          # ⚠️ A grep that matched nothing looks exactly like a gate that passed. If the Python moves
          # or the call style changes, this must fail loudly rather than silently verify an empty set.
          if [ -z "$names" ]; then
            echo "FAIL: extracted no jclass() names from app/src/main/python/ — either the sources"
            echo "      moved or the call style changed, and this gate is no longer checking anything."
            exit 1
          fi
          echo "Python resolves these by name:"
          echo "$names" | sed 's/^/  /'

          # ⚠️ THE DEX FILES ONLY, NEVER THE WHOLE APK. `lcars_jsi.py` ships as an asset, so an
          # APK-wide grep would match the Python source's own string literal and pass no matter what
          # R8 did to the class — a gate that cannot fail, which is worse than no gate.
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          for d in $(unzip -l "$apk" | awk '/ classes[0-9]*\.dex$/ {print $4}'); do
            unzip -p "$apk" "$d" > "/tmp/dex/$(basename "$d")"
          done
          if [ -z "$(ls -A /tmp/dex)" ]; then
            echo "FAIL: no classes*.dex extracted from the APK."
            exit 1
          fi
          echo "checking $(ls /tmp/dex | wc -l) dex file(s)"

          # The DEX type descriptor, not the dotted name. That distinction is the check: a dotted
          # string could survive as an ordinary constant somewhere while the class itself was
          # renamed, whereas `Ldev/mascwa/pulse/…/JsRuntime;` exists only if the class does.
          descriptor() { printf 'L%s;' "$(echo "$1" | tr '.' '/')"; }

          missing=""
          for n in $names; do
            if grep -qa -- "$(descriptor "$n")" /tmp/dex/*.dex; then
              echo "  kept: $n"
            else
              echo "  GONE: $n"
              missing="$missing $n"
            fi
          done

          # ⚠️ Two-sided, so the run itself shows the matcher discriminates. A grep that finds
          # everything is indistinguishable from a passing gate, and this project has now shipped
          # four different flavours of "green for the wrong reason". A name that certainly does not
          # exist must come back absent.
          if grep -qa -- "$(descriptor "$SENTINEL")" /tmp/dex/*.dex; then
            echo "FAIL: the sentinel $SENTINEL was 'found' in the DEX. This check matches anything,"
            echo "      so its passes mean nothing. Fix the matcher before trusting this step."
            exit 1
          fi
          echo "  (sentinel correctly absent — the check can fail)"

          if [ -n "$missing" ]; then
            echo "FAIL: R8 removed or renamed these, and Python resolves them BY NAME at runtime:"
            for n in $missing; do echo "        $n"; done
            echo "      Add a keep to app/proguard-rules.pro beside the Chaquopy block:"
            for n in $missing; do echo "        -keep class $n { *; }"; done
            echo "      Shipping without it would look completely fine here and fail on the device."
            exit 1
          fi
          echo "Python's Java lookups survived R8."
        env:
          # Deliberately absurd, and never referenced by any source, so its presence in the DEX could
          # only mean the matcher is broken.
          SENTINEL: dev.mascwa.pulse.ThisClassDoesNotExist_R8GateSentinel

      # ⚠️ An artifact is a **zip** — GitHub zips every one and offers no way not to — so it is not
      # installable on a phone, and the GitHub mobile app does not list artifacts at all. The step
      # summary below is the route that works from a phone. This upload is for a computer.
      #
      # ⚠️ `retention-days` because the `latest` release is the durable copy and is always the newest
      # build, so an artifact older than a few days has no consumer — while each one is ~290 MB and
      # this branch pushes many times a day. The cost is that an OLD run's page stops offering a
      # download after a week; the newest build is always on the release, which is also what the
      # in-app updater reads.
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to 'latest' release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pulse — debug build #${{ github.run_number }}"
          prerelease: true
          # ⚠️ The direct link is spelled out because the release page is the only thing the GitHub
          # mobile app will show — it lists no artifacts. The asset name is stable, so the URL never
          # changes and always serves the newest build.
          body: |
            Auto-built APK (build #${{ github.run_number }}) from commit ${{ github.sha }}.

            **[▸ Download and install it](${{ github.server_url }}/${{ github.repository }}/releases/download/latest/app-release.apk)**

            Non-debuggable, baseline-profile optimized (faster cold start). Sideload on a Pixel 10
            Pro XL (allow "install unknown apps"). Installs as an in-place UPDATE over a previous
            build — your settings and downloaded model are kept. (One-time: if you have an older
            differently-signed build, uninstall it once before installing this.)

            This repository is private, so following that link needs a signed-in GitHub session in
            whatever browser opens it. The app updates itself without any of this.
          files: app/build/outputs/apk/release/app-release.apk

      - name: Remove stale debug asset from the rolling release
        # The published APK was renamed app-debug.apk -> app-release.apk; the old asset lingers on the
        # in-place 'latest' release and would otherwise shadow the current build. Drop it (no-op once gone).
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest app-debug.apk -y || true

      # ⚠️ Renders at the TOP of the run summary, above the artifacts drawer, and links to the bare
      # `.apk` rather than to a zip. It matters less here than on the nutrition workflow — this app
      # installs its own updates unattended — but the asymmetry is what made the other one look
      # broken: this run page has always carried an artifact and that one had none at all.
      #
      # ⚠️ `always()` so it still appears when the publish failed; gated on the APK existing, so a
      # failed compile writes no misleading link.
      - name: Say where to get it
        if: always() && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        run: |
          size=$(numfmt --to=iec "$(stat -c%s app/build/outputs/apk/release/app-release.apk)")
          base="${{ github.server_url }}/${{ github.repository }}"
          {
            echo "## LCARS — build #${{ github.run_number }}"
            echo
            echo "### [▸ Download and install it]($base/releases/download/latest/app-release.apk)"
            echo
            echo "$size · arm64 only · installs in place over a previous build, keeping your"
            echo "settings and the downloaded model."
            echo
            echo "That link is a bare \`.apk\` the phone's installer opens directly. You must be"
            echo "**signed in to GitHub in that browser** — this repository is private. Normally you"
            echo "need none of this: the app fetches and installs its own updates unattended."
            echo
            echo "The artifact below is a **zip**, because GitHub zips every artifact; Android"
            echo "cannot install one. It is there for a computer."
            echo
            echo "Looking for the standalone nutrition app? It has its own workflow and its own"
            echo "release under \`nutrition-latest\`."
          } >> "$GITHUB_STEP_SUMMARY"

          # ⚠️ The same link as an annotation — the block a phone screenshot proved renders, and
          # renders URLs as tappable links, where the summary above renders nowhere. `notice` rather
          # than `warning` deliberately: see the longer note in nutrition-build.yml.
          echo "::notice title=Download LCARS ($size)::$base/releases/download/latest/app-release.apk"
