name: Android Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :core:telemetry:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        # Pass the run number as the versionCode so each published build out-versions the last
        # (Android blocks downgrades); combined with the pinned debug key this enables in-place
        # updates that preserve the user's settings + downloaded model.
        run: ./gradlew assembleDebug -PPULSE_VERSION_CODE=${{ github.run_number }} --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to 'latest' release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pulse — debug build #${{ github.run_number }}"
          prerelease: true
          body: "Auto-built debug APK (build #${{ github.run_number }}) from commit ${{ github.sha }}. Sideload on a Pixel 10 Pro XL (allow 'install unknown apps'). Installs as an in-place UPDATE over a previous build — your settings and downloaded model are kept. (One-time: if you have an older differently-signed build, uninstall it once before installing this.)"
          files: app/build/outputs/apk/debug/app-debug.apk
