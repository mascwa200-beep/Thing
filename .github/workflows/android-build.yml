name: Android Build

on:
  push:
    # Build on every code branch, but skip the telemetry-only `debug-reports` branch the in-app
    # uploader writes to — it carries scrubbed crash reports (no code), so a build/republish there
    # would only churn the version with identical code. (Later `!` pattern wins over `**`.)
    branches:
      - "**"
      - "!debug-reports"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # The acoustic interrogator compiles native code (whisper.cpp / llama.cpp are coming).
          # ⚠️ The NDK string must match `ndkVersion` in app/build.gradle.kts exactly — AGP looks for
          # that one and reports only that it is missing, never that a different one is present.
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fetch whisper.cpp at a pinned tag
        run: |
          set -e
          dir=app/src/main/cpp/whisper.cpp
          repo=https://github.com/ggml-org/whisper.cpp
          # Pinned, not "latest": a native layer that follows upstream without anyone deciding to is
          # a build whose speech recognition can change under it.
          #
          # The tag below could NOT be verified when it was written - the development container
          # cannot reach GitHub - so rather than fail blind, the step falls back to the newest v*
          # tag and says loudly which one it used. That turns a wrong guess into the answer inside a
          # single ~25 minute round instead of two, and the fallback cannot drift silently because
          # it warns every time it fires. Pin whatever it reports.
          TAG="v1.7.6"
          if git clone --quiet --depth 1 --branch "$TAG" "$repo" "$dir" 2>/dev/null; then
            echo "whisper.cpp @ $TAG (pinned)"
          else
            newest=$(git ls-remote --tags --refs --sort=-v:refname "$repo" 'v*' | head -1 | sed 's#.*refs/tags/##')
            echo "::warning::pinned whisper.cpp tag $TAG did not resolve; using $newest - update TAG in this workflow"
            git clone --quiet --depth 1 --branch "$newest" "$repo" "$dir"
          fi
          # The CMake integration is guarded by if(EXISTS) so the tree's absence degrades to a
          # host-only build locally. On CI that guard must never be what decides, or a build that
          # quietly lost speech recognition would still go green.
          test -f "$dir/CMakeLists.txt" || { echo "FAIL: whisper.cpp tree is not present after cloning"; exit 1; }
          echo "whisper.cpp tree: $(du -sh "$dir" | cut -f1)"
          # Diagnostic, not a gate: whisper and llama each bundle ggml, so the two add_subdirectory
          # calls can collide on target names. Report how this tag guards it, so a collision is
          # explained in the same round it happens rather than the round after.
          echo "whisper ggml guard:"; grep -nE "NOT TARGET ggml|USE_SYSTEM_GGML" "$dir/CMakeLists.txt" || echo "  (none found)"

      - name: Fetch llama.cpp at a pinned build
        run: |
          set -e
          dir=app/src/main/cpp/llama.cpp
          repo=https://github.com/ggml-org/llama.cpp
          # ⚠️ llama.cpp tags are build numbers (b4600), NOT semver, so the pattern differs from
          # whisper's. Same fallback-and-warn shape and the same reason: this pin could not be
          # verified from a machine that cannot reach GitHub.
          TAG="b4600"
          if git clone --quiet --depth 1 --branch "$TAG" "$repo" "$dir" 2>/dev/null; then
            echo "llama.cpp @ $TAG (pinned)"
          else
            newest=$(git ls-remote --tags --refs --sort=-v:refname "$repo" 'b*' | head -1 | sed 's#.*refs/tags/##')
            echo "::warning::pinned llama.cpp tag $TAG did not resolve; using $newest - update TAG in this workflow"
            git clone --quiet --depth 1 --branch "$newest" "$repo" "$dir"
          fi
          test -f "$dir/CMakeLists.txt" || { echo "FAIL: llama.cpp tree is not present after cloning"; exit 1; }
          echo "llama.cpp tree: $(du -sh "$dir" | cut -f1)"
          # ⚠️ THE API PROBE, and it is the point of this step beyond the clone. llama.cpp renamed a
          # good deal of its C API during 2024-25 (llama_load_model_from_file became
          # llama_model_load_from_file, vocab accessors moved off the model), so which names a given
          # build number carries is a fact about that tag rather than something to recall. Printing
          # it means one round answers both "does this tag exist" and "does the bridge use the right
          # names", instead of two.
          hdr="$dir/include/llama.h"
          echo "llama.h API probe:"
          for sym in llama_backend_init llama_model_default_params llama_model_load_from_file \
                     llama_load_model_from_file llama_context_default_params llama_init_from_model \
                     llama_new_context_with_model llama_model_get_vocab llama_tokenize \
                     llama_batch_get_one llama_decode llama_sampler_chain_init \
                     llama_sampler_init_greedy llama_sampler_sample llama_vocab_is_eog \
                     llama_token_to_piece llama_model_free llama_free_model; do
            if grep -q "\b$sym\b" "$hdr" 2>/dev/null; then echo "  present  $sym"; else echo "  ABSENT   $sym"; fi
          done

      - name: Run unit tests
        run: ./gradlew :core:telemetry:testDebugUnitTest :core:model-inference:testDebugUnitTest :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build release APK
        # Release here is the SHIPPED sideload build: non-debuggable (so the baseline profile is honoured
        # for PGO-style AOT) but kept on the same package id + debug keystore as before, so it updates in
        # place. The run number is the versionCode so each build out-versions the last (no downgrades).
        run: ./gradlew assembleRelease -PPULSE_VERSION_CODE=${{ github.run_number }} --stacktrace --no-daemon

      - name: Verify the native layer packaged
        # ⚠️ This is the ONLY gate on the native build, and it has to live here.
        # `:app:testDebugUnitTest` runs on the host JVM, so it cannot load an arm64-v8a .so — a unit
        # test asserting NativeBridge.available would fail on a perfectly good build and pass on one
        # where CMake silently produced nothing. What actually proves the toolchain worked is the
        # library being inside the shipped APK, for the target ABI, so that is what is asserted.
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "inspecting $apk"
          if unzip -l "$apk" | grep -q "lib/arm64-v8a/liblcarsnative.so"; then
            unzip -l "$apk" | grep "lib/arm64-v8a/" || true
            # ⚠️ And that whisper.cpp really linked. Its JNI entry points are compiled only under
            # HAVE_WHISPER, so their ABSENCE from the shipped library is the check - a missing symbol
            # is a fact, where a runtime flag would only be a claim. `nm -D` reads the dynamic symbol
            # table, which survives stripping because JNI could not resolve anything otherwise.
            unzip -p "$apk" lib/arm64-v8a/liblcarsnative.so > /tmp/lcarsnative.so
            if nm -D --defined-only /tmp/lcarsnative.so | grep -q "WhisperNative_nativeInit"; then
              echo "whisper.cpp linked:"
              nm -D --defined-only /tmp/lcarsnative.so | grep WhisperNative || true
              if nm -D --defined-only /tmp/lcarsnative.so | grep -q "LlamaNative_nativeInit"; then
                echo "llama.cpp linked:"
                nm -D --defined-only /tmp/lcarsnative.so | grep LlamaNative || true
              else
                echo "FAIL: liblcarsnative.so shipped WITHOUT llama.cpp - the adjudicator would be absent."
                exit 1
              fi
            else
              echo "FAIL: liblcarsnative.so shipped WITHOUT whisper.cpp - the if(EXISTS) guard took the"
              echo "      host-only branch, so speech recognition would be silently absent."
              nm -D --defined-only /tmp/lcarsnative.so | grep Java_ || echo "(no JNI exports at all)"
              exit 1
            fi
          else
            echo "FAIL: liblcarsnative.so is not in the APK — the CMake build produced nothing."
            unzip -l "$apk" | grep "lib/" || echo "(no native libraries at all)"
            exit 1
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to 'latest' release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pulse — debug build #${{ github.run_number }}"
          prerelease: true
          body: "Auto-built APK (build #${{ github.run_number }}) from commit ${{ github.sha }}. Non-debuggable, baseline-profile optimized (faster cold start). Sideload on a Pixel 10 Pro XL (allow 'install unknown apps'). Installs as an in-place UPDATE over a previous build — your settings and downloaded model are kept. (One-time: if you have an older differently-signed build, uninstall it once before installing this.)"
          files: app/build/outputs/apk/release/app-release.apk

      - name: Remove stale debug asset from the rolling release
        # The published APK was renamed app-debug.apk -> app-release.apk; the old asset lingers on the
        # in-place 'latest' release and would otherwise shadow the current build. Drop it (no-op once gone).
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest app-debug.apk -y || true
