name: Android Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :core:telemetry:testDebugUnitTest :core:model-inference:testDebugUnitTest --stacktrace --no-daemon

      - name: Build release APK
        # Release here is the SHIPPED sideload build: non-debuggable (so the baseline profile is honoured
        # for PGO-style AOT) but kept on the same package id + debug keystore as before, so it updates in
        # place. The run number is the versionCode so each build out-versions the last (no downgrades).
        run: ./gradlew assembleRelease -PPULSE_VERSION_CODE=${{ github.run_number }} --stacktrace --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to 'latest' release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pulse — debug build #${{ github.run_number }}"
          prerelease: true
          body: "Auto-built APK (build #${{ github.run_number }}) from commit ${{ github.sha }}. Non-debuggable, baseline-profile optimized (faster cold start). Sideload on a Pixel 10 Pro XL (allow 'install unknown apps'). Installs as an in-place UPDATE over a previous build — your settings and downloaded model are kept. (One-time: if you have an older differently-signed build, uninstall it once before installing this.)"
          files: app/build/outputs/apk/release/app-release.apk
