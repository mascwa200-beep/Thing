name: Desktop Build

# Compiles/tests the :desktop module only — a separate workflow (own file, own job) from android-build.yml
# so this genuinely-separate module never slows down or risks the Android build's own gate.
#
# Two jobs: the fast Linux compile+test gate, and a Windows packaging job. Packaging must run on Windows
# because jpackage only ever builds an installer for the host it runs on — an ubuntu runner cannot produce
# an .msi at all. It is gated on the Linux job passing so a compile break fails in ~1 minute rather than
# after a full installer build.
on:
  push:
    paths:
      - "desktop/**"
      # The desktop bundles the app's Knowledge Base assets and mirrors its pure cores, so a content
      # wave or a core change alters what this module ships. Without these, the bundle and mirror
      # guards would only run when desktop/ itself happened to change.
      - "app/src/main/assets/survival/**"
      - "app/src/main/java/dev/mascwa/pulse/data/survival/**"
      # ⚠️ And the live-TV catalogue repository, which is mirrored from the app too and was missing
      # here — so editing it and forgetting to regenerate would not have run this workflow at all,
      # and the drift guard that would have caught it never fires. Found by checking every mirror
      # source against this list mechanically rather than reading it; MirrorDriftTest now asserts it.
      - "app/src/main/java/dev/mascwa/pulse/data/live/**"
      # It bundles the typefaces out of the app's resource directory too, so removing or renaming
      # one there would break the desktop at render time with nothing in this workflow to catch it.
      - "app/src/main/res/font/**"
      - "core/telemetry/src/**"
      - "tools/mirror_desktop_cores.py"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

# Needed to publish the installer to the 'desktop-latest' release. Without it the packaging job builds a
# perfectly good MSI and then 403s on the upload — the same declaration android-build.yml already carries.
permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build :desktop
        run: ./gradlew :desktop:build --stacktrace --no-daemon

  package-windows:
    # The actual deliverable: an installable Windows app. Only worth spending a Windows runner on once the
    # code is known to compile, hence the dependency.
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package MSI
        # jpackage is host-targeted: this step is the only way an .msi ever gets produced.
        # gradlew.bat is the native Windows launcher. `./gradlew` also works here (verified on a real
        # windows-latest runner), so this is a clarity choice, not a fix for a breakage.
        #
        # The build number is this workflow's own run_number, NOT the Android build's — they are separate
        # counters, and the in-app updater looks the run up by number in THIS workflow to decide whether
        # the build finished. Passing the wrong one would have it check an unrelated run.
        run: .\gradlew.bat :desktop:packageMsi -PdesktopBuild=${{ github.run_number }} --stacktrace --no-daemon

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lcars-desktop-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Name the installer predictably
        # jpackage names the file after the package and version (LCARS-1.0.19.msi). The in-app updater
        # wants a stable asset name so each publish REPLACES the last rather than piling versioned assets
        # up on a rolling release forever; the version travels in the release name instead, exactly as the
        # Android APK does.
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "packageMsi produced no .msi" }
          Copy-Item $msi.FullName -Destination "LCARS-desktop.msi" -Force

      - name: Publish MSI to the 'desktop-latest' release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ Its OWN tag, deliberately not the Android build's `latest`. Both workflows run on the same
          # pushes, and action-gh-release rewrites the release NAME each time — sharing a tag would mean
          # whichever finished last overwrote the other's name, and the name is where each updater reads
          # its build number from. Separate tags, no interference in either direction.
          tag_name: desktop-latest
          name: "LCARS desktop — build #${{ github.run_number }}"
          prerelease: true
          body: "Windows installer (build #${{ github.run_number }}) from commit ${{ github.sha }}. Installs as an in-place upgrade over a previous build. The app checks this release itself — see ABOUT inside the app."
          files: LCARS-desktop.msi
