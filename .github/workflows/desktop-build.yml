name: Desktop Build

# Compiles/tests the :desktop module only — a separate workflow (own file, own job) from android-build.yml
# so this genuinely-separate module never slows down or risks the Android build's own gate.
#
# Two jobs: the fast Linux compile+test gate, and a Windows packaging job. Packaging must run on Windows
# because jpackage only ever builds an installer for the host it runs on — an ubuntu runner cannot produce
# an .msi at all. It is gated on the Linux job passing so a compile break fails in ~1 minute rather than
# after a full installer build.
on:
  push:
    paths:
      - "desktop/**"
      # The desktop bundles the app's Knowledge Base assets, so a content wave alters what this module
      # ships and has to re-verify it. Without this, the bundle guards would only run when desktop/
      # itself happened to change.
      - "app/src/main/assets/survival/**"
      # ⚠️ The live-TV catalogue repository is the ONE file still copy-adapted from :app (its fetching
      # goes through :app's own HttpClient/DiskCache, which :desktop cannot reach). Everything else that
      # used to be mirrored now comes from :core:telemetry directly, so those entries are gone with the
      # mirrors themselves rather than left here to look load-bearing.
      - "app/src/main/java/dev/mascwa/pulse/data/live/**"
      # It bundles the typefaces out of the app's resource directory too, so removing or renaming
      # one there would break the desktop at render time with nothing in this workflow to catch it.
      - "app/src/main/res/font/**"
      # And the star catalogue, for the same reason: it is bundled out of the app's asset directory,
      # so a change to it changes what this module ships and what its bundle guard has to check.
      - "core/sky/src/main/assets/sky/**"
      # The module's own build file too, not just its sources — :desktop depends on this project
      # now, so a dependency change there changes what the desktop compiles against.
      - "core/telemetry/**"
      - "core/feeds/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
      # ⚠️ The same omission the nutrition workflow had. `gradle.properties` carries the daemon's
      # memory, parallelism and the build cache, and the wrapper decides which Gradle runs at all —
      # both apply to this module as much as to the Android ones, and neither would have rebuilt it.
      - "gradle.properties"
      - "gradle/wrapper/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

# Needed to publish the installer to the 'desktop-latest' release. Without it the packaging job builds a
# perfectly good MSI and then 403s on the upload — the same declaration android-build.yml already carries.
permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build :desktop
        # ⚠️ `--configure-on-demand`, and it is not an optimisation. Gradle configures EVERY project
        # by default, so building this plain Kotlin/JVM module was configuring `:app` — which
        # declares `ndkVersion` and an `externalNativeBuild`, so AGP downloaded the whole ~1 GB NDK
        # before compiling a line of desktop code. That is a gigabyte of network on every run for a
        # module that has no native code in it, and on run 236 the download failed and took the
        # build with it: `InstallFailedException: Failed to install ndk;27.0.12077973`.
        #
        # `:desktop` depends only on `:core:telemetry` and `:core:feeds`, both plain Kotlin/JVM, so
        # `:app` never needs to be configured at all. Measured rather than assumed: this exact
        # command succeeds in a container with **no Android SDK installed whatsoever**, which it
        # could not do if `:app` were being configured.
        run: ./gradlew :desktop:build --configure-on-demand --stacktrace --no-daemon

  package-windows:
    # The actual deliverable: an installable Windows app. Only worth spending a Windows runner on once the
    # code is known to compile, hence the dependency.
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package MSI
        # jpackage is host-targeted: this step is the only way an .msi ever gets produced.
        # gradlew.bat is the native Windows launcher. `./gradlew` also works here (verified on a real
        # windows-latest runner), so this is a clarity choice, not a fix for a breakage.
        #
        # The build number is this workflow's own run_number, NOT the Android build's — they are separate
        # counters, and the in-app updater looks the run up by number in THIS workflow to decide whether
        # the build finished. Passing the wrong one would have it check an unrelated run.
        run: .\gradlew.bat :desktop:packageMsi -PdesktopBuild=${{ github.run_number }} --configure-on-demand --stacktrace --no-daemon

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lcars-desktop-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          # ⚠️ The `desktop-latest` release is the durable copy and is always the newest build — it is
          # what the in-app updater reads — so an artifact older than a few days has no consumer,
          # while each one is stored for the repository's default 90 days. The cost is that an OLD
          # run's page stops offering a download after a week.
          retention-days: 7

      - name: Name the installer predictably
        # jpackage names the file after the package and version (LCARS-1.0.19.msi). The in-app updater
        # wants a stable asset name so each publish REPLACES the last rather than piling versioned assets
        # up on a rolling release forever; the version travels in the release name instead, exactly as the
        # Android APK does.
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "packageMsi produced no .msi" }
          Copy-Item $msi.FullName -Destination "LCARS-desktop.msi" -Force

      - name: Publish MSI to the 'desktop-latest' release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ Its OWN tag, deliberately not the Android build's `latest`. Both workflows run on the same
          # pushes, and action-gh-release rewrites the release NAME each time — sharing a tag would mean
          # whichever finished last overwrote the other's name, and the name is where each updater reads
          # its build number from. Separate tags, no interference in either direction.
          tag_name: desktop-latest
          name: "LCARS desktop — build #${{ github.run_number }}"
          prerelease: true
          body: "Windows installer (build #${{ github.run_number }}) from commit ${{ github.sha }}. Installs as an in-place upgrade over a previous build. The app checks this release itself — see ABOUT inside the app."
          files: LCARS-desktop.msi
