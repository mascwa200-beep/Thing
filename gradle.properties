# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# R8: use the more conservative (ProGuard-compatible) mode for the first minified release, so shrinking
# is less aggressive about reflection/JNI surfaces. Can be removed (-> fullMode) once verified on-device.
android.enableR8.fullMode=false

# Optional release-signing credentials. Leave blank to build/sign with the
# debug key (fine for personal sideloading). To produce a properly signed
# release APK, fill these in or pass them as -P flags / env vars.
PULSE_RELEASE_STORE_FILE=
PULSE_RELEASE_STORE_PASSWORD=
PULSE_RELEASE_KEY_ALIAS=
PULSE_RELEASE_KEY_PASSWORD=
