# Project-wide Gradle settings.
# ⚠️ **2048m was a default that predated everything that now makes this build large, and BOTH
# applications ran out of it within the same hour** — `:app` in `mergeReleaseNativeDebugMetadata`
# (run 1999), which took R8, lint and the whole daemon down with it, and `:nutrition` in
# `compressReleaseAssets`. Two different tasks, one ceiling.
#
# The driver is the shared food database, and it is measured rather than guessed: it grew from
# 312 MB to **424 MB** when the further nutrients landed, and both applications package it.
# `CompressAssetsWorkAction` hands each asset to `com.android.zipflinger.BytesSource(Path, ...)`,
# whose body is a bare `Files.readAllBytes` — so that one asset alone wants its own bytes plus its
# deflated output live at once, on top of R8 and everything `org.gradle.parallel=true` is running beside it.
#
# 5g against a 16 GB runner, sized so the database can roughly triple again before this recurs. It
# leaves room for the Kotlin compile daemon, which reads `kotlin.daemon.jvmargs` and has its own
# heap, so raising this does not multiply.
#
# ⚠️ `-Xmx` is a ceiling and not a reservation, so this is safe on a smaller development machine too:
# the JVM starts regardless, and the local builds here (`:desktop`, `:core:telemetry`, `:core:feeds`)
# use a small fraction of it. There is no Android SDK on the development machine, so the invocation
# that actually needs this only ever runs on CI.
org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ⚠️ The CONFIGURATION cache is off, and that is not the same thing as the BUILD cache above, which
# stays on and is the one that actually saves work here.
#
# Chaquopy is incompatible with it. Its `BuildPackagesTask.sitePackages` is a Kotlin `lazy` whose
# initialiser asserts that the build's Python virtualenv directory exists — and Gradle's serializer
# FORCES a lazy in order to store it (`SynchronizedLazyImpl.writeReplace`), which happens at
# configuration time, before the task that creates that directory has run. So the build fails with
# "app/build/python/env/debug/lib does not exist" during cache storage. Checked rather than assumed:
# the field is present and identical in both 16.1.0 and 17.0.0, so upgrading is not a fix, and the
# plugin carries no configuration-cache handling of any kind.
#
# Turning it off costs this repo nothing measurable, which is why this is the trade taken rather than
# dropping Python:
#   - no workflow caches `.gradle/configuration-cache`, so CI checks out fresh and never reads one;
#   - a CI run's two Gradle invocations request different task sets, and entries are keyed by the
#     requested tasks, so there is no reuse within a run either;
#   - there is no Android SDK on the development machine, so `:app` is never configured locally;
#   - `:desktop` is already built with `--no-configuration-cache` for an unrelated reason.
# We were paying to write an entry that was never read once.
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# R8: use the more conservative (ProGuard-compatible) mode for the first minified release, so shrinking
# is less aggressive about reflection/JNI surfaces. Can be removed (-> fullMode) once verified on-device.
android.enableR8.fullMode=false

# Optional release-signing credentials. Leave blank to build/sign with the
# debug key (fine for personal sideloading). To produce a properly signed
# release APK, fill these in or pass them as -P flags / env vars.
PULSE_RELEASE_STORE_FILE=
PULSE_RELEASE_STORE_PASSWORD=
PULSE_RELEASE_KEY_ALIAS=
PULSE_RELEASE_KEY_PASSWORD=
