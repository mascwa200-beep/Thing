[versions]
# Build tooling
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"

# SDK levels
compileSdk = "35"
minSdk = "31"
# ⚠️ The floor for code that is NOT the LCARS application. `:app` targets one phone and can afford
# a 2021 minimum; the standalone nutrition app is meant to run anywhere, and the shared modules it
# uses have to declare a floor at least as low or the manifest merger refuses the build. 26 is where
# `java.time` becomes available without core library desugaring, and the shared code uses it in a
# dozen places.
minSdkWide = "26"
targetSdk = "35"

# AndroidX core / lifecycle / activity
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
splashscreen = "1.0.1"

# Compose
composeBom = "2024.12.01"

# Async + serialization
coroutines = "1.9.0"
serializationJson = "1.7.3"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"
retrofitKotlinxConverter = "1.0.0"
jsoup = "1.18.3"
# Python-in-Android. Pinned to a version whose plugin jar was inspected directly rather than
# recalled: 16.1.0 declares MIN_AGP_VERSION 7.0.0 (we are on 8.7.3) and exposes the
# chaquopy{defaultConfig{...}} DSL used below.
chaquopy = "16.1.0"

# Storage / background / images / location
datastore = "1.1.1"
healthConnect = "1.1.0-beta01"
room = "2.6.1"
workManager = "2.10.0"
profileinstaller = "1.4.1"
coil = "2.7.0"
playServicesLocation = "21.3.0"

# Media playback (internet radio)
media3 = "1.5.1"

# Charts
composeCharts = "0.1.2"

# On-device LLM (MediaPipe LLM Inference — standalone, NOT Play Services)
# 0.10.25+ is required to load the LiteRT-LM `.litertlm` model format; 0.10.24 only
# opened legacy `.task` zip bundles (hence "Unable to open zip archive" on a .litertlm).
mediapipeGenai = "0.10.27"
# Sensorium's on-device classifiers (same versions the pre-b9ba600 perception stack shipped with).
mediapipeTasks = "0.10.21"
camerax = "1.4.1"
zxing = "3.5.3"

# Offline on-device speech-to-text (Vosk — Kaldi-based, no Play Services / no account)
vosk = "0.3.75"
jna = "5.13.0"

# Vector map engine (MapLibre — open-source, no Google; tiles from keyless OpenFreeMap)
maplibre = "11.8.0"

# Pure-JVM Lua interpreter for sandboxed, user-approved tool authoring (no native, no DEX loading)
luaj = "3.0.1"

# Testing
junit = "4.13.2"

# Desktop companion (Kotlin/JVM + Compose Multiplatform). Pinned to 1.7.3 — the last Compose Multiplatform
# line built for the pre-K2-transition Kotlin compiler; 1.8.0+ requires Kotlin 2.1.0+, which this repo isn't
# on (kotlin = "2.0.21" above). Confirmed against JetBrains' own compatibility guide and Maven Central's
# published plugin-marker versions before picking this, not assumed from memory.
composeMultiplatform = "1.7.3"

[libraries]
# Core / lifecycle / activity
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Compose (versions supplied by the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# Networking
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-scalars = { group = "com.squareup.retrofit2", name = "converter-scalars", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Storage / background / images / location
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
# Declared explicitly because RadioController imports IcyInfo from it directly. It already arrives
# transitively at compile scope via media3-exoplayer; naming it means a change in that POM cannot
# quietly break an import we own.
androidx-media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }

# On-device LLM
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeGenai" }
mediapipe-tasks-audio = { group = "com.google.mediapipe", name = "tasks-audio", version.ref = "mediapipeTasks" }
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasks" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# The one Guava class CameraX's public API returns. See the note at its use in :nutrition.
guava = { group = "com.google.guava", name = "guava", version = "31.1-android" }

# Offline speech-to-text (JNA must be the @aar variant on Android — applied in the build script)
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }

# Vector map engine (3D, custom-styleable; open-source MapLibre GL Native)
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

# Pure-JVM Lua interpreter (sandboxed tool authoring)
luaj-jse = { group = "org.luaj", name = "luaj-jse", version.ref = "luaj" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
